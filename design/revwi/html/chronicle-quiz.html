<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Revwi Chronicle - Quiz</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, sans-serif; background: #F4F7FB; color: #14243A; }
    .rail {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid #D8E0EA;
    }
    .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
    .stage {
      background: #fff;
      border-radius: 12px;
      padding: 32px;
      margin-bottom: 24px;
    }
    .stage h1 { font-size: 28px; line-height: 1.2; max-width: 70ch; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .ans {
      min-height: 64px;
      border-radius: 12px;
      padding: 16px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
    }
    .a { background: #2457C5; }
    .b { background: #B43B55; }
    .c { background: #08756B; }
    .d { background: #F6C453; color: #14243A; }
    .foot { margin-top: 24px; display: flex; justify-content: space-between; align-items: center; }
    button {
      background: #2457C5;
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header class="rail">
    <strong>Revwi</strong>
    <span>Question 3 of 25</span>
    <span>Prep</span>
    <span>Sound on</span>
  </header>
  <div class="wrap">
    <section class="stage">
      <h1>Which Git command uploads commits to a remote?</h1>
    </section>
    <div class="grid">
      <div class="ans a">git push</div>
      <div class="ans b">git init</div>
      <div class="ans c">git add</div>
      <div class="ans d">git commit</div>
    </div>
    <footer class="foot">
      <span>Choose one answer</span>
      <button type="button">Next</button>
    </footer>
  </div>
</body>
</html>
